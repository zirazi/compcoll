<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparer des collections</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "Comic Sans MS", "Comic Neue", cursive, sans-serif;
        color: #26324a;
        background: linear-gradient(135deg, #e8f7ff, #f7edff 55%, #fff5d9);
      }
      button {
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
        border: 0;
      }
      button:focus-visible {
        outline: 4px solid #ffb52e;
        outline-offset: 3px;
      }
      .app {
        width: min(1150px, 100vw);
        height: 100dvh;
        max-height: 900px;
        margin: auto;
        padding: clamp(7px, 1.5vh, 16px);
        display: flex;
        flex-direction: column;
        gap: clamp(5px, 1vh, 10px);
      }
      header {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        min-height: 44px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .tool {
        min-width: 42px;
        min-height: 40px;
        padding: 6px 11px;
        border-radius: 14px;
        background: white;
        box-shadow: 0 3px 0 #d9e3ef;
        font-weight: bold;
        color: #26324a;
      }
      .home {
        font-size: 23px;
        background: #ffda67;
      }
      .restart {
        font-size: 23px;
        background: #d9f5e9;
      }
      .result-btn {
        justify-self: end;
        background: #ffadbe;
      }
      .score {
        justify-self: center;
        background: white;
        border: 3px solid white;
        box-shadow: 0 3px 0 #d9e3ef;
        border-radius: 16px;
        padding: 5px 18px;
        font-size: clamp(19px, 3vh, 27px);
        font-weight: bold;
        white-space: nowrap;
      }
      h1 {
        font-size: clamp(25px, 4vh, 38px);
        line-height: 1.1;
        text-align: center;
        margin: 0;
        color: #04060b;
      }
      .subtitle {
        text-align: center;
        margin: 0;
        font-size: clamp(15px, 2.2vh, 19px);
      }
      .screen {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2vh, 18px);
      }
      .levels {
        width: min(900px, 100%);
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .level {
        border-radius: 23px;
        padding: 20px 12px;
        background: white;
        box-shadow: 0 6px 0 #dce5f2;
        border: 3px solid transparent;
        min-height: 170px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 9px;
        color: #26324a;
      }
      .level:nth-child(1) {
        border-color: #7dc9ff;
      }
      .level:nth-child(2) {
        border-color: #b5a0ff;
      }
      .level:nth-child(3) {
        border-color: #ffc95c;
      }
      .level .emoji {
        font-size: 45px;
      }
      .level strong {
        font-size: 24px;
      }
      .level span {
        font-size: 17px;
      }
      .hidden {
        display: none !important;
      }
      .exercise-area {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(8px, 1.5vh, 14px);
        min-height: 0;
        flex: 1;
      }
      .collections {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(90px, 0.55fr) minmax(
            0,
            1.15fr
          );
        align-items: stretch;
        gap: clamp(8px, 1.5vw, 16px);
        flex: 1;
        min-height: 0;
        max-height: 520px;
      }
      .collection {
        position: relative;
        background: white;
        border: 4px solid #d6dce5;
        border-radius: 24px;
        min-width: 0;
        min-height: 0;
        box-shadow: 0 4px 0 #cbd2dc;
        overflow: hidden;
      }
      .collection.right {
        border-color: #d6dce5;
      }
      .objects {
        position: absolute;
        inset: 0;
      }
      .obj {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        user-select: none;
        white-space: nowrap;
      }
      .middle {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .answer-slot {
        width: 100%;
        height: 55%;
        min-height: 75px;
        max-height: 220px;
        background: #e2e5e9;
        border: 4px dashed #aeb6c1;
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(40px, 7vh, 65px);
        font-weight: bold;
        color: #000;
      }
      .answer-slot.filled {
        border-style: solid;
        background: #e2e5e9;
        color: #000;
      }
      .answers {
        display: flex;
        justify-content: center;
        gap: clamp(12px, 3vw, 26px);
        width: 100%;
      }
      .sign {
        width: clamp(76px, 14vw, 130px);
        height: clamp(55px, 9vh, 78px);
        border-radius: 18px;
        background: #e2e5e9;
        border: 3px solid #cbd2dc;
        box-shadow: 0 5px 0 #cbd2dc;
        font-size: clamp(32px, 6vh, 48px);
        font-weight: bold;
        color: #000;
      }
      .sign:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 #cbd2dc;
      }
      .feedback {
        height: clamp(18px, 2.5vh, 26px);
        font-size: 18px;
        text-align: center;
      }
      .good {
        color: #188b55 !important;
      }
      .bad {
        color: #d73548 !important;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: #24324b66;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal {
        width: min(470px, 100%);
        background: white;
        border-radius: 25px;
        padding: 22px;
        text-align: center;
        box-shadow: 0 12px 40px #26324a44;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modal h2 {
        margin: 0;
        font-size: 28px;
      }
      .modal p {
        font-size: 20px;
        margin: 0;
        white-space: pre-line;
      }
      .modal-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .action {
        padding: 12px 18px;
        border-radius: 15px;
        background: #dff3ff;
        font-weight: bold;
        font-size: 18px;
      }
      .action.primary {
        background: #c9f1dc;
      }
      .final-score {
        font-size: clamp(20px, 3.5vh, 30px);
        font-weight: bold;
        line-height: 1.8;
        text-align: center;
        white-space: pre-line;
      }
      @media (max-width: 650px) {
        .app {
          padding: 6px;
          gap: 6px;
        }
        header {
          gap: 4px;
        }
        .tools {
          gap: 4px;
        }
        .tool {
          min-width: 36px;
          min-height: 36px;
          padding: 4px 7px;
        }
        .score {
          font-size: 18px;
          padding: 4px 9px;
        }
        .levels {
          grid-template-columns: 1fr;
          gap: 9px;
        }
        .level {
          min-height: 0;
          flex-direction: row;
          justify-content: flex-start;
          padding: 10px 14px;
          gap: 12px;
        }
        .level .emoji {
          font-size: 33px;
          width: 42px;
        }
        .level strong {
          font-size: 19px;
        }
        .level span {
          font-size: 15px;
        }
        .collections {
          grid-template-columns: minmax(0, 1fr) 62px minmax(0, 1fr);
          gap: 5px;
        }
        .collection {
          border-radius: 16px;
        }
        .answer-slot {
          height: 48%;
          min-height: 65px;
          border-radius: 16px;
          font-size: 40px;
        }
        .sign {
          width: clamp(66px, 21vw, 100px);
          height: 55px;
          border-radius: 15px;
        }
      }
      @media (max-height: 620px) {
        .app {
          padding: 5px;
          gap: 4px;
        }
        header {
          min-height: 34px;
        }
        .tool {
          min-height: 32px;
        }
        h1 {
          font-size: 24px;
        }
        .level {
          min-height: 115px;
          padding: 8px;
        }
        .level .emoji {
          font-size: 32px;
        }
        .collections {
          max-height: 400px;
        }
        .sign {
          height: 48px;
        }
        .answer-slot {
          min-height: 55px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header id="topbar" class="hidden">
        <div class="tools">
          <button class="tool home" id="homeBtn" aria-label="Maison">🏠</button>
          <button class="tool restart" id="restartBtn" aria-label="Recommencer">
            ⟳
          </button>
          <button class="tool" id="instructionBtn" aria-label="Consigne">
            ❔
          </button>
        </div>
        <div class="score" id="score">0/0</div>
        <button class="tool result-btn" id="resultBtn">Résultat</button>
      </header>

      <section class="screen" id="levelScreen">
        <h1>Comparer des collections</h1>
        <p class="subtitle">Choisis ton niveau !</p>
        <div class="levels">
          <button class="level" data-level="0">
            <div class="emoji">🐠</div>
            <div>
              <strong>Niveau 1</strong><br /><span>De 2 à 12 objets</span>
            </div>
            <span>⭐</span>
          </button>
          <button class="level" data-level="1">
            <div class="emoji">🦋</div>
            <div>
              <strong>Niveau 2</strong><br /><span>De 4 à 16 objets</span>
            </div>
            <span>🌟</span>
          </button>
          <button class="level" data-level="2">
            <div class="emoji">🦕</div>
            <div>
              <strong>Niveau 3</strong><br /><span>De 4 à 20 objets</span>
            </div>
            <span>🚀</span>
          </button>
        </div>
      </section>

      <section class="screen hidden" id="gameScreen">
        <h1>Quel signe faut-il choisir ?</h1>
        <div class="exercise-area">
          <div class="collections">
            <div class="collection">
              <div class="objects" id="leftObjects"></div>
            </div>
            <div class="middle">
              <div class="answer-slot" id="answerSlot">?</div>
            </div>
            <div class="collection right">
              <div class="objects" id="rightObjects"></div>
            </div>
          </div>
          <div class="answers">
            <button class="sign" data-sign="lt" aria-label="Plus petit que">
              &lt;
            </button>
            <button class="sign" data-sign="eq" aria-label="Égal">=</button>
            <button class="sign" data-sign="gt" aria-label="Plus grand que">
              &gt;
            </button>
          </div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
        </div>
      </section>

      <section class="screen hidden" id="finalScreen">
        <h1>Résultat</h1>
        <div class="final-score" id="finalScore"></div>
        <button class="action primary" id="finalRestart">⟳ Recommencer</button>
        <button class="action" id="finalHome">🏠 Choisir un niveau</button>
      </section>
    </div>

    <div class="modal-backdrop hidden" id="modalBackdrop">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <h2 id="modalTitle">Consigne</h2>
        <p id="modalText"></p>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>

    <script>
      (() => {
        "use strict";

        const levels = [
          { min: 2, max: 12 },
          { min: 4, max: 16 },
          { min: 4, max: 20 },
        ];

        const sets = [
          ["🍎", "🍐", "🍓", "🍌", "🍊", "🍇", "🍉", "🍒", "🥝", "🍋"],
          ["🐠", "🦋", "🐞", "🐢", "🐸", "🐙", "🐝", "🐬", "🦀", "🐳"],
          ["⭐", "🌈", "☀️", "🌙", "☁️", "❄️", "🔥", "💧", "🌸", "🍀"],
          ["🚗", "🚕", "🚌", "🚲", "🚂", "🚀", "🛴", "🚜", "🚁", "⛵"],
          ["⚽", "🏀", "🏈", "🎾", "🎱", "🏓", "🥎", "🏐", "🏸", "🥏"],
          ["✏️", "📚", "✂️", "🖍️", "📏", "🖊️", "📐", "📝", "🎒", "🧸"],
        ];

        const $ = (id) => document.getElementById(id);

        let levelIndex = 0;
        let exercises = [];
        let index = 0;
        let correctFirst = 0;
        let counted = 0;
        let locked = false;
        let attempts = [];
        let current = null;
        let tryCounts = [0, 0, 0];

        function shuffle(array) {
          for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
          }
          return array;
        }

        function makeExercises() {
          const { min, max } = levels[levelIndex];
          const pairs = [];

          // Répartir les 20 exercices entre les trois signes.
          for (let i = 0; i < 20; i++) {
            const kind = i % 3;
            let a, b;

            if (kind === 1) {
              a = min + Math.floor(Math.random() * (max - min + 1));
              b = a;
            } else {
              const possibleA = [];

              for (let n = min; n <= max; n++) {
                if (kind === 0 ? n < max : n > min) possibleA.push(n);
              }

              a = possibleA[Math.floor(Math.random() * possibleA.length)];

              const possibleB = [];
              for (let n = min; n <= max; n++) {
                if (Math.abs(a - n) <= 3 && (kind === 0 ? n > a : n < a)) {
                  possibleB.push(n);
                }
              }

              // Le signe choisi reste respecté, avec un écart maximal de 3.
              b = possibleB[Math.floor(Math.random() * possibleB.length)];
            }

            pairs.push({
              a,
              b,
              setL: Math.floor(Math.random() * sets.length),
              setR: Math.floor(Math.random() * sets.length),
              attemptNo: 0,
            });
          }

          return shuffle(pairs);
        }

        function startLevel(n) {
          levelIndex = n;
          exercises = makeExercises();
          index = 0;
          correctFirst = 0;
          counted = 0;
          tryCounts = [0, 0, 0];
          attempts = Array(20).fill(null);
          locked = false;

          $("levelScreen").classList.add("hidden");
          $("finalScreen").classList.add("hidden");
          $("gameScreen").classList.remove("hidden");
          $("topbar").classList.remove("hidden");

          render();
        }

        function scoreText() {
          return `${correctFirst}/${counted}`;
        }

        function updateScore() {
          $("score").textContent = scoreText();
        }

        function render() {
          if (index >= exercises.length) {
            showFinal();
            return;
          }

          current = exercises[index];
          locked = false;

          $("answerSlot").textContent = "?";
          $("answerSlot").classList.remove("filled");
          $("feedback").textContent = "";
          $("feedback").className = "feedback";

          fillObjects("leftObjects", current.a, sets[current.setL]);
          fillObjects("rightObjects", current.b, sets[current.setR]);
          updateScore();
        }

        function fillObjects(id, count, emojiSet) {
          const node = $(id);
          node.innerHTML = "";

          // Positions aléatoires, sans grille ni alignement régulier.
          const width = count > 14 ? 17 : count > 9 ? 21 : 26;
          const height = count > 14 ? 16 : count > 9 ? 21 : 26;
          const positions = [];

          for (let i = 0; i < count; i++) {
            let x,
              y,
              overlap,
              tries = 0;

            do {
              x = 3 + Math.random() * (94 - width);
              y = 3 + Math.random() * (94 - height);

              overlap = positions.some(
                (p) =>
                  Math.abs(p.x - x) < width * 0.68 &&
                  Math.abs(p.y - y) < height * 0.68,
              );

              tries++;
            } while (overlap && tries < 35);

            positions.push({ x, y });

            const el = document.createElement("span");
            el.className = "obj";
            el.textContent =
              emojiSet[Math.floor(Math.random() * emojiSet.length)];
            el.style.left = x + "%";
            el.style.top = y + "%";
            el.style.width = width + "%";
            el.style.height = height + "%";
            el.style.fontSize =
              count > 14 ? "clamp(17px,3.2vh,30px)" : "clamp(20px,4vh,38px)";
            el.style.transform = `rotate(${Math.round(Math.random() * 36 - 18)}deg)`;
            el.setAttribute("aria-hidden", "true");

            node.appendChild(el);
          }
        }

        function signFor(ex) {
          if (ex.a < ex.b) return "lt";
          if (ex.a === ex.b) return "eq";
          return "gt";
        }

        function choose(sign) {
          if (locked || !current || attempts[index] !== null) return;

          locked = true;
          current.attemptNo++;
          const attemptNo = current.attemptNo;
          const ok = sign === signFor(current);

          $("answerSlot").textContent =
            sign === "lt" ? "<" : sign === "eq" ? "=" : ">";
          $("answerSlot").classList.add("filled");

          if (ok) {
            tryCounts[attemptNo - 1]++;
            counted++;
            attempts[index] = true;

            if (attemptNo === 1) correctFirst++;

            updateScore();

            setTimeout(() => {
              index++;
              if (index >= 20) showFinal();
              else render();
            }, 500);
          } else if (attemptNo >= 3) {
            counted++;
            attempts[index] = false;
            updateScore();

            setTimeout(() => {
              index++;
              if (index >= 20) showFinal();
              else render();
            }, 500);
          } else {
            setTimeout(() => {
              locked = false;
              $("answerSlot").textContent = "?";
              $("answerSlot").classList.remove("filled");
            }, 500);
          }
        }

        function attemptsResultText() {
          return `Réussies du premier coup : ${tryCounts[0]}
Réussies du deuxième coup : ${tryCounts[1]}
Réussies du troisième coup : ${tryCounts[2]}`;
        }

        function showResult() {
          openModal("Résultat", attemptsResultText(), [
            { label: "Fermer", cls: "primary", fn: closeModal },
          ]);
        }

        function showFinal() {
          $("gameScreen").classList.add("hidden");
          $("finalScreen").classList.remove("hidden");
          $("finalScore").textContent = attemptsResultText();
        }

        function openModal(title, text, actions) {
          $("modalTitle").textContent = title;
          $("modalText").textContent = text;

          const area = $("modalActions");
          area.innerHTML = "";

          actions.forEach((action) => {
            const button = document.createElement("button");
            button.className = "action " + (action.cls || "");
            button.textContent = action.label;
            button.onclick = action.fn;
            area.appendChild(button);
          });

          $("modalBackdrop").classList.remove("hidden");
        }

        function closeModal() {
          $("modalBackdrop").classList.add("hidden");
        }

        function instructions() {
          const text =
            "Compte les objets dans chaque collection. Choisis le signe qui convient : < signifie plus petit que, = signifie égal à et > signifie plus grand que. Tu peux essayer jusqu’à trois fois.";

          openModal("Consigne", text, [
            {
              label: "🔊 Écouter",
              fn: () => {
                if ("speechSynthesis" in window) {
                  speechSynthesis.cancel();
                  const utterance = new SpeechSynthesisUtterance(text);
                  utterance.lang = "fr-FR";
                  utterance.rate = 0.85;
                  speechSynthesis.speak(utterance);
                }
              },
            },
            { label: "J’ai compris !", cls: "primary", fn: closeModal },
          ]);
        }

        function restart() {
          closeModal();
          startLevel(levelIndex);
        }

        function home() {
          closeModal();
          $("topbar").classList.add("hidden");
          $("gameScreen").classList.add("hidden");
          $("finalScreen").classList.add("hidden");
          $("levelScreen").classList.remove("hidden");
          current = null;
        }

        function nextByTeacher() {
          if (!current || $("gameScreen").classList.contains("hidden")) return;

          // Exercice ignoré : il n'est pas comptabilisé.
          index++;
          if (index >= 20) showFinal();
          else render();
        }

        function prevByTeacher() {
          if (!current || $("gameScreen").classList.contains("hidden")) return;

          index = Math.max(0, index - 1);
          render();
        }

        document.querySelectorAll(".level").forEach((button) => {
          button.addEventListener("click", () => {
            startLevel(Number(button.dataset.level));
          });
        });

        document.querySelectorAll(".sign").forEach((button) => {
          button.addEventListener("click", () => {
            choose(button.dataset.sign);
          });
        });

        $("homeBtn").onclick = home;
        $("restartBtn").onclick = restart;
        $("instructionBtn").onclick = instructions;
        $("resultBtn").onclick = showResult;
        $("finalRestart").onclick = restart;
        $("finalHome").onclick = home;

        $("modalBackdrop").addEventListener("click", (event) => {
          if (event.target === $("modalBackdrop")) closeModal();
        });

        document.addEventListener("keydown", (event) => {
          if (event.ctrlKey && event.key === "ArrowRight") {
            event.preventDefault();
            nextByTeacher();
          }
          if (event.ctrlKey && event.key === "ArrowLeft") {
            event.preventDefault();
            prevByTeacher();
          }
          if (event.key === "Escape") closeModal();
        });
      })();
    </script>
  </body>
</html>
